kind = "web"
previewPath = "/"
title = "Mohammad Ghanayem — Personal Website"
version = "1.0.0"
id = "artifacts/personal-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19147

[services.development]
run = "pnpm --filter @workspace/personal-website run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/personal-website", "run", "build"]

[services.production.build.env]
PORT = "19147"
BASE_PATH = "/"
NODE_ENV = "production"

[services.production.run]
# Express server injects per-page OG/Twitter meta tags into HTML before sending,
# so social crawlers (LinkedIn, WhatsApp, Twitter/X) see correct metadata.
# In production the Vite import is skipped; only express + drizzle-orm are used.
args = ["pnpm", "--filter", "@workspace/personal-website", "run", "serve"]

[services.production.run.env]
PORT = "19147"
NODE_ENV = "production"
BASE_PATH = "/"

[services.env]
PORT = "19147"
BASE_PATH = "/"
