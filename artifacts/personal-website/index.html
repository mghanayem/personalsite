<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="robots" content="index, follow" />
    <!--
      OG / social meta tags are injected here by server.ts before the HTML is
      sent to the browser or social crawler (LinkedIn, WhatsApp, Twitter/X, etc.).
      react-helmet-async then overrides them for client-side navigation.
      The server replaces the marker below with per-page <title>, og:*, and
      twitter:* tags fetched from the database.
    -->
    <!-- OG_META_PLACEHOLDER -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
