openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bilingual personal website + CMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: pages
    description: CMS page management
  - name: sections
    description: CMS section management
  - name: images
    description: Section image management
  - name: account
    description: Admin account settings
  - name: dashboard
    description: Admin dashboard
  - name: settings
    description: Site branding settings
  - name: public
    description: Public website endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/session:
    get:
      operationId: getAdminSession
      tags: [auth]
      summary: Check current admin session
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Admin dashboard overview stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Pages ─────────────────────────────────────────────────────────────────
  /pages:
    get:
      operationId: listPages
      tags: [pages]
      summary: List all pages
      responses:
        "200":
          description: List of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Page"
    post:
      operationId: createPage
      tags: [pages]
      summary: Create a new page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageInput"
      responses:
        "201":
          description: Page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pages/{id}:
    get:
      operationId: getPage
      tags: [pages]
      summary: Get page with its sections
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Page with sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageWithSections"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePage
      tags: [pages]
      summary: Update page metadata
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdate"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePage
      tags: [pages]
      summary: Delete a page (non-homepage only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Cannot delete homepage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Sections ──────────────────────────────────────────────────────────────
  /pages/{pageId}/sections:
    get:
      operationId: listSections
      tags: [sections]
      summary: List all sections for a page
      parameters:
        - in: path
          name: pageId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionWithImages"
    post:
      operationId: createSection
      tags: [sections]
      summary: Add a section to a page
      parameters:
        - in: path
          name: pageId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionInput"
      responses:
        "201":
          description: Section created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionWithImages"

  /sections/{id}:
    get:
      operationId: getSection
      tags: [sections]
      summary: Get a section with its images
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Section with images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionWithImages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateSection
      tags: [sections]
      summary: Update a section's data
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdate"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionWithImages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteSection
      tags: [sections]
      summary: Delete a section
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /sections/{id}/visibility:
    patch:
      operationId: toggleSectionVisibility
      tags: [sections]
      summary: Toggle section visibility
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityUpdate"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionWithImages"

  /pages/{pageId}/sections/reorder:
    post:
      operationId: reorderSections
      tags: [sections]
      summary: Reorder sections on a page
      parameters:
        - in: path
          name: pageId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Reordered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Images ────────────────────────────────────────────────────────────────
  # Note: POST /api/sections/:sectionId/images uses multipart/form-data handled
  # directly by the Express route with Multer — not in this spec to avoid
  # codegen complexity with binary file types.

  /images/{id}:
    patch:
      operationId: updateImage
      tags: [images]
      summary: Update image captions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUpdate"
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete an image and its file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /sections/{sectionId}/images/reorder:
    post:
      operationId: reorderImages
      tags: [images]
      summary: Reorder images in a section
      parameters:
        - in: path
          name: sectionId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Account ───────────────────────────────────────────────────────────────
  /account/password:
    patch:
      operationId: changePassword
      tags: [account]
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /account/username:
    patch:
      operationId: changeUsername
      tags: [account]
      summary: Change admin username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsernameChange"
      responses:
        "200":
          description: Username changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Settings ──────────────────────────────────────────────────────────────
  /settings/branding:
    get:
      operationId: getBrandingSettings
      tags: [settings]
      summary: Get site branding colors (public)
      responses:
        "200":
          description: Branding settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettings"
    patch:
      operationId: updateBrandingSettings
      tags: [settings]
      summary: Update site branding colors (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingUpdate"
      responses:
        "200":
          description: Updated branding settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Public endpoints ──────────────────────────────────────────────────────
  /public/nav:
    get:
      operationId: getPublicNav
      tags: [public]
      summary: Get published navigation pages
      responses:
        "200":
          description: Nav items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NavItem"

  /public/pages/{slug}:
    get:
      operationId: getPublicPage
      tags: [public]
      summary: Get a published page by slug with visible sections
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public page with sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/homepage:
    get:
      operationId: getPublicHomepage
      tags: [public]
      summary: Get homepage with visible sections
      responses:
        "200":
          description: Homepage with sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPage"

components:
  schemas:
    # ── Generic ───────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────
    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminSession:
      type: object
      required: [id, username, isDefaultPassword]
      properties:
        id:
          type: integer
        username:
          type: string
        isDefaultPassword:
          type: boolean

    # ── Dashboard ─────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalPages, publishedPages, draftPages, totalSections]
      properties:
        totalPages:
          type: integer
        publishedPages:
          type: integer
        draftPages:
          type: integer
        totalSections:
          type: integer

    # ── Pages ─────────────────────────────────────────────────────────────
    Page:
      type: object
      required: [id, titleAr, titleEn, slug, isPublished, showInNav, isHomepage, createdAt, updatedAt]
      properties:
        id:
          type: integer
        titleAr:
          type: string
        titleEn:
          type: string
        slug:
          type: string
        isPublished:
          type: boolean
        showInNav:
          type: boolean
        isHomepage:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageInput:
      type: object
      required: [titleAr, titleEn, slug]
      properties:
        titleAr:
          type: string
          minLength: 1
        titleEn:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        isPublished:
          type: boolean
        showInNav:
          type: boolean

    PageUpdate:
      type: object
      properties:
        titleAr:
          type: string
          minLength: 1
        titleEn:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        isPublished:
          type: boolean
        showInNav:
          type: boolean

    PageWithSections:
      type: object
      required: [id, titleAr, titleEn, slug, isPublished, showInNav, isHomepage, createdAt, updatedAt, sections]
      properties:
        id:
          type: integer
        titleAr:
          type: string
        titleEn:
          type: string
        slug:
          type: string
        isPublished:
          type: boolean
        showInNav:
          type: boolean
        isHomepage:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SectionWithImages"

    # ── Section Data (structured to avoid looseObject generation) ─────────
    # This covers the union of all section type fields.
    # The server stores the full JSON; this schema validates known fields.
    SectionDataItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        titleAr:
          type: string
        titleEn:
          type: string
        descriptionAr:
          type: string
        descriptionEn:
          type: string
        subheadingAr:
          type: string
        subheadingEn:
          type: string
        date:
          type: string
        icon:
          type: string
        bullets:
          type: array
          items:
            $ref: "#/components/schemas/BulletItem"

    BulletItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        textAr:
          type: string
        textEn:
          type: string

    SectionData:
      type: object
      properties:
        titleAr:
          type: string
        titleEn:
          type: string
        contentAr:
          type: string
        contentEn:
          type: string
        imagePosition:
          type: string
        email:
          type: string
        linkedin:
          type: string
        locationAr:
          type: string
        locationEn:
          type: string
        cta1Ar:
          type: string
        cta1En:
          type: string
        cta1Url:
          type: string
        cta2Ar:
          type: string
        cta2En:
          type: string
        cta2Url:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SectionDataItem"

    # ── Sections ──────────────────────────────────────────────────────────
    Section:
      type: object
      required: [id, pageId, type, sortOrder, isVisible, data]
      properties:
        id:
          type: integer
        pageId:
          type: integer
        type:
          type: string
          enum: [hero, text, text_with_image, image_gallery, cards_grid, timeline, contact_strip]
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        data:
          $ref: "#/components/schemas/SectionData"

    SectionWithImages:
      type: object
      required: [id, pageId, type, sortOrder, isVisible, data, images]
      properties:
        id:
          type: integer
        pageId:
          type: integer
        type:
          type: string
          enum: [hero, text, text_with_image, image_gallery, cards_grid, timeline, contact_strip]
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        data:
          $ref: "#/components/schemas/SectionData"
        images:
          type: array
          items:
            $ref: "#/components/schemas/SectionImage"

    SectionInput:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [hero, text, text_with_image, image_gallery, cards_grid, timeline, contact_strip]
        data:
          $ref: "#/components/schemas/SectionData"

    SectionUpdate:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SectionData"

    VisibilityUpdate:
      type: object
      required: [isVisible]
      properties:
        isVisible:
          type: boolean

    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer

    # ── Images ────────────────────────────────────────────────────────────
    SectionImage:
      type: object
      required: [id, sectionId, filename, captionAr, captionEn, sortOrder, url]
      properties:
        id:
          type: integer
        sectionId:
          type: integer
        filename:
          type: string
        captionAr:
          type: string
        captionEn:
          type: string
        sortOrder:
          type: integer
        url:
          type: string

    ImageUpdate:
      type: object
      properties:
        captionAr:
          type: string
        captionEn:
          type: string

    # ── Account ───────────────────────────────────────────────────────────
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    UsernameChange:
      type: object
      required: [newUsername, currentPassword]
      properties:
        newUsername:
          type: string
          minLength: 3
        currentPassword:
          type: string

    # ── Settings ──────────────────────────────────────────────────────────
    BrandingSettings:
      type: object
      required: [primaryColor, accentColor, cta1BgColor, cta1TextColor, cta2BgColor, cta2TextColor]
      properties:
        primaryColor:
          type: string
          description: "Hex color for the primary theme color (e.g. #0e1a2a)"
        accentColor:
          type: string
          description: "Hex color for the accent theme color (e.g. #f1f5f9)"
        cta1BgColor:
          type: string
          description: "Hex background color for the primary hero button"
        cta1TextColor:
          type: string
          description: "Hex text color for the primary hero button"
        cta2BgColor:
          type: string
          description: "Hex background color for the secondary hero button"
        cta2TextColor:
          type: string
          description: "Hex text color for the secondary hero button"

    BrandingUpdate:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta1BgColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta1TextColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta2BgColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta2TextColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    # ── Public ────────────────────────────────────────────────────────────
    NavItem:
      type: object
      required: [id, titleAr, titleEn, slug, isHomepage]
      properties:
        id:
          type: integer
        titleAr:
          type: string
        titleEn:
          type: string
        slug:
          type: string
        isHomepage:
          type: boolean

    PublicPage:
      type: object
      required: [id, titleAr, titleEn, slug, isHomepage, sections]
      properties:
        id:
          type: integer
        titleAr:
          type: string
        titleEn:
          type: string
        slug:
          type: string
        isHomepage:
          type: boolean
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SectionWithImages"
