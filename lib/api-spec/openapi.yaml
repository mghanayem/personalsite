          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta1BgColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta1TextColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        cta2BgColor:
