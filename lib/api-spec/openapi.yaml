    # ── AI Settings ───────────────────────────────────────────────────────
    AiStatus:
      type: object
      required: [isConfigured]
      properties:
        isConfigured:
          type: boolean

    AiKeyInput:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 1

    # ── Anthropic ─────────────────────────────────────────────────────────
    AnthropicConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time

    AnthropicMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    AnthropicConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string

    AnthropicMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    AnthropicConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"

    # ── Generic ───────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────
    LoginCredentials:
      type: object
      required: [username, password]
      properties:
