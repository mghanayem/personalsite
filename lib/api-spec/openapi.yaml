          type: string
        titleEn:
          type: string
        slug:
          type: string
        isPublished:
          type: boolean
        showInNav:
          type: boolean
        isHomepage:
          type: boolean
        icon:
          type: string
          nullable: true
        seoTitleAr:
          type: string
          nullable: true
        seoTitleEn:
          type: string
          nullable: true
        seoDescAr:
          type: string
          nullable: true
        seoDescEn:
          type: string
          nullable: true
        seoImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageInput:
      type: object
      required: [titleAr, titleEn, slug]
      properties:
        titleAr:
          type: string
          minLength: 1
        titleEn:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        isPublished:
          type: boolean
        showInNav:
          type: boolean
