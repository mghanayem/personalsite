          type: string
        newPassword:
          type: string
          minLength: 6

    UsernameChange:
      type: object
      required: [newUsername, currentPassword]
      properties:
        newUsername:
          type: string
          minLength: 3
        currentPassword:
          type: string

    # ── Settings ──────────────────────────────────────────────────────────
    BrandingSettings:
      type: object
      required: [primaryColor, accentColor, cta1BgColor, cta1TextColor, cta2BgColor, cta2TextColor, defaultLanguage, blogBgColor, blogTextColor, blogAccentColor]
      properties:
        primaryColor:
          type: string
          description: "Hex color for the primary theme color (e.g. #0e1a2a)"
        accentColor:
          type: string
          description: "Hex color for the accent theme color (e.g. #f1f5f9)"
        cta1BgColor:
          type: string
          description: "Hex background color for the primary hero button"
        cta1TextColor:
          type: string
          description: "Hex text color for the primary hero button"
        cta2BgColor:
          type: string
          description: "Hex background color for the secondary hero button"
        cta2TextColor:
          type: string
          description: "Hex text color for the secondary hero button"
        defaultLanguage:
          type: string
          enum: [ar, en]
          description: "Default language shown to new visitors"
        blogBgColor:
          type: string
          description: "Hex background color for the blog and post pages"
        blogTextColor:
          type: string
          description: "Hex text color for blog post content"
        blogAccentColor:
          type: string
          description: "Hex accent color for blog post cards"
        seoPersonJobTitle:
          type: string
          nullable: true
          description: "Job title used in schema.org/Person JSON-LD"
        seoWebsiteUrl:
          type: string
          nullable: true
          description: "Website URL for the Person structured data"
        seoLinkedinUrl:
          type: string
          nullable: true
          description: "LinkedIn profile URL for sameAs array"
        seoTwitterUrl:
          type: string
          nullable: true
          description: "Twitter/X profile URL for sameAs array"
        seoGithubUrl:
          type: string
          nullable: true
          description: "GitHub profile URL for sameAs array"

    BrandingUpdate:
      type: object
