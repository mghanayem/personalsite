          type: string
        password:
          type: string

    AdminSession:
      type: object
      required: [id, username, isDefaultPassword]
      properties:
        id:
          type: integer
        username:
          type: string
        isDefaultPassword:
          type: boolean

    # ── Dashboard ─────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalPages, publishedPages, draftPages, totalSections]
      properties:
        totalPages:
          type: integer
        publishedPages:
          type: integer
        draftPages:
          type: integer
        totalSections:
          type: integer

    # ── Pages ─────────────────────────────────────────────────────────────
