          minLength: 1
        slug:
          type: string
          minLength: 1
        isPublished:
          type: boolean
        showInNav:
          type: boolean
        icon:
          type: string
          nullable: true
        seoTitleAr:
          type: string
          nullable: true
        seoTitleEn:
          type: string
          nullable: true
        seoDescAr:
          type: string
          nullable: true
        seoDescEn:
          type: string
          nullable: true
        seoImageUrl:
          type: string
          nullable: true

    PageWithSections:
      type: object
      required: [id, titleAr, titleEn, slug, isPublished, showInNav, isHomepage, createdAt, updatedAt, sections]
      properties:
        id:
          type: integer
        titleAr:
          type: string
        titleEn:
          type: string
        slug:
          type: string
        isPublished:
          type: boolean
        showInNav:
          type: boolean
        isHomepage:
          type: boolean
        icon:
          type: string
          nullable: true
        seoTitleAr:
          type: string
          nullable: true
        seoTitleEn:
          type: string
          nullable: true
        seoDescAr:
          type: string
          nullable: true
        seoDescEn:
          type: string
          nullable: true
        seoImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SectionWithImages"

    # ── Section Data (structured to avoid looseObject generation) ─────────
    # This covers the union of all section type fields.
    # The server stores the full JSON; this schema validates known fields.
    SectionDataItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        titleAr:
          type: string
        titleEn:
          type: string
        descriptionAr:
          type: string
        descriptionEn:
          type: string
        subheadingAr:
          type: string
        subheadingEn:
          type: string
        date:
          type: string
        icon:
          type: string
        bullets:
          type: array
          items:
            $ref: "#/components/schemas/BulletItem"

    BulletItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        textAr:
          type: string
        textEn:
          type: string

    SectionData:
      type: object
      properties:
