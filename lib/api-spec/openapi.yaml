        cta2Ar:
          type: string
        cta2En:
          type: string
        cta2Url:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SectionDataItem"

    # ── Sections ──────────────────────────────────────────────────────────
    Section:
      type: object
      required: [id, pageId, type, sortOrder, isVisible, data]
      properties:
        id:
          type: integer
        pageId:
          type: integer
        type:
          type: string
          enum: [hero, text, text_with_image, image_gallery, cards_grid, timeline, contact_strip]
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        data:
          $ref: "#/components/schemas/SectionData"

    SectionWithImages:
      type: object
      required: [id, pageId, type, sortOrder, isVisible, data, images]
      properties:
        id:
          type: integer
        pageId:
          type: integer
        type:
          type: string
          enum: [hero, text, text_with_image, image_gallery, cards_grid, timeline, contact_strip]
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        data:
          $ref: "#/components/schemas/SectionData"
        images:
          type: array
          items:
            $ref: "#/components/schemas/SectionImage"

    SectionInput:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [hero, text, text_with_image, image_gallery, cards_grid, timeline, contact_strip]
        data:
          $ref: "#/components/schemas/SectionData"

    SectionUpdate:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SectionData"

    VisibilityUpdate:
      type: object
      required: [isVisible]
      properties:
        isVisible:
          type: boolean

    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer

    # ── Images ────────────────────────────────────────────────────────────
    SectionImage:
      type: object
